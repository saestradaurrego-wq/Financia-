name: Financia security tests

on:
  push:
    branches:
      - feature/pwa-instalable
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --check financia-api-v2-client.js
          node --check financia-review-panel.js
          node --check worker/index.js
      - name: Test Firebase token verification and user isolation
        run: node --experimental-default-type=module --test worker/tests/*.test.mjs
      - name: Test D1 schema and cross-user integrity
        run: python3 db/tests/test_schema.py

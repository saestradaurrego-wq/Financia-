name: Verificar Financia
on:
  push:
    branches: [main, audit-seguridad-integracion-2026-11]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar aplicación y PWA
        run: node --experimental-vm-modules --test tests/*.test.mjs

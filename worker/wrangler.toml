// Configuracion de ejemplo para un Worker API v2 separado.
// No despliega nada automaticamente; requiere configurar el binding DB
// con el ID real de la base de datos en Cloudflare antes de desplegar.
name = "financia-api-v2-staging"
main = "index.js"
compatibility_date = "2026-10-01"

# Completar manualmente en entorno de pruebas:
# [[d1_databases]]
# binding = "DB"
# database_name = "financia-v2-staging"
# database_id = "ID_REAL_DE_D1_STAGING"

# Importante: no publicar en el dominio del Worker antiguo sin
# verificar que POST /api/compras existente se mantenga intacto.

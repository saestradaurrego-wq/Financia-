<style>
/* Concepto: panel financiero sobrio. Barra lateral en escritorio, barra inferior en móvil, tarjetas planas con cifras grandes en tipografía display. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1224; --surface:#111C33; --surface2:#17243F; --ink:#E8EEF8; --muted:#9AA8C2; --line:#22304D;
  --primary:#5B8FEA; --on-primary:#071226; --primary-soft:#172A4D; --focus:#7FA8F2;
  --pos:#3DD6A0; --pos-soft:#0F2E28; --on-pos:#052019; --on-neg:#2A0A07;
  --warn:#F0B44A; --warn-soft:#33270E; --warn2:#F59B4A; --neg:#FF7F73; --neg-soft:#3A1A19;
  --bar-inc:#3DD6A0; --bar-exp:#6EA2FF;
  --c1:#6EA2FF; --c2:#3DD6A0; --c3:#F0B44A; --c4:#A58BF0; --c5:#FF8C82; --c6:#7CC3EE; --c7:#B5CF63; --c8:#8896B0;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1224; --surface:#111C33; --surface2:#17243F; --ink:#E8EEF8; --muted:#9AA8C2; --line:#22304D;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.15}
h1{font-size:1.7rem;font-weight:700} h2{font-size:1.15rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0} button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .pos{color:var(--pos)} .neg{color:var(--neg)}

/* Layout */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 14px 18px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line)}

.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 3px 5px rgba(18,59,53,.14))}.brand-name{font-size:1.42rem;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}

.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.main{min-width:0}
.main-in{max-width:1120px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.top-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.monthnav button:hover:not(:disabled){background:var(--surface2);color:var(--ink)}
.monthnav span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}
.bottomnav{display:none}
.side-theme{display:none}
@media (max-width:899px){
  body{overflow-wrap:anywhere}

  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:600;border-radius:10px;min-width:0}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;line-height:1.2}
.btn:hover{background:var(--surface2)}

.btn.pos:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.danger.solid{background:var(--neg);color:var(--on-neg)}
.btn.sm{padding:6px 10px;font-size:.88rem;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:1rem}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--muted)}
.icon:hover{background:var(--surface2);color:var(--ink)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical;min-height:160px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:.85rem;font-weight:600;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted)}
.err{font-size:.82rem;color:var(--neg);min-height:0}
.err:empty{display:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.row2,.row3{grid-template-columns:minmax(0,1fr)}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative;display:block;text-align:center;padding:8px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{font-size:.85rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.kpi{display:flex;flex-direction:column;gap:6px;padding:16px}
.kpi .l{font-size:.82rem;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .v{font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.75rem);letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1100px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:.76rem;font-weight:600;white-space:nowrap}
.chip.demo{background:var(--warn-soft);color:var(--warn)}
.chip.est{background:var(--primary-soft);color:var(--primary)}
.chip.rec{background:var(--primary-soft);color:var(--primary)}
.chip.good{background:var(--pos-soft);color:var(--pos)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--neg-soft);color:var(--neg)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner .grow{flex:1 1 260px}
.banner.info{background:var(--primary-soft);color:var(--primary)}

/* Insights */
.ins{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ins li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.ins .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none;background:var(--muted)}
.ins .good .dot{background:var(--pos)} .ins .warn .dot{background:var(--warn2)}

/* Progress */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--pos)}
.bar>.lvl-warn75{background:var(--c3)} .bar>.lvl-warn90{background:var(--warn2)} .bar>.lvl-over{background:var(--neg)}
.bar>.lvl-goal{background:var(--primary)}
.brow{display:grid;grid-template-columns:minmax(90px,1.1fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:7px 0}
.brow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .pc{font-size:.85rem;min-width:44px;text-align:right}
@media (max-width:480px){.brow{grid-template-columns:minmax(0,1fr) auto;} .brow .bar{grid-column:1/-1;order:3}}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:default}
.chart [data-tip]:hover{opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:520px){.donut-wrap{grid-template-columns:minmax(0,1fr)}.donut-wrap svg{max-width:190px;margin:0 auto}}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dl li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem}
.dl i{width:10px;height:10px;border-radius:3px}
.dl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:.8rem;line-height:1.35;max-width:220px;opacity:0;transition:opacity .1s}
#tip b{display:block;font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 14px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--c8)}
.empty h3{color:var(--ink)}
.empty p{max-width:42ch}

/* Movements */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;align-items:end}
.mlist{list-style:none;margin:0;padding:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.m-desc{font-weight:600;overflow-wrap:anywhere}
.m-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.82rem;margin-top:3px}
.m-amt{font-weight:700;text-align:right;white-space:nowrap}
.m-act{display:flex}
@media (max-width:520px){.mrow{grid-template-columns:minmax(0,1fr) auto}.m-act{grid-column:1/-1;justify-content:flex-end;margin-top:-4px}}
.summary-strip{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.9rem;color:var(--muted)}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
td input{max-width:130px;text-align:right;padding:6px 8px}

/* Goals / Debts */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:12px}
.gcard .big{font-family:var(--font-display);font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:.88rem}
.facts dt{color:var(--muted);font-size:.78rem}
.facts dd{margin:0;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hist{list-style:none;margin:0;padding:0;font-size:.86rem;display:grid;gap:4px;max-height:180px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.plan.best{border-color:var(--pos);background:var(--pos-soft)}
.plan .big{font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.plan ol{margin:0;padding-left:20px;font-size:.88rem}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{margin-bottom:-4px}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list-plain li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:10px;flex-wrap:wrap}
.tag-pending{display:flex;gap:8px;align-items:flex-start}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 24px 70px rgba(5,12,28,.35)}

.df{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}

.steps i.on{background:var(--primary)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}

.opt b{display:block}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1}

.skel{display:grid;gap:12px;padding:24px}
.skel i{display:block;height:84px;border-radius:14px;background:var(--surface2)}
@media (prefers-reduced-motion: no-preference){.skel i{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}}
</style>

<script>/*

 * Se usa tanto en el navegador (window.FinCalc) como en las pruebas de Node.
 * Todas las cifras de proyección son ESTIMACIONES: nunca inventan tasas ni condiciones.

(function (root, factory) {

function render() {
  var app = $('#app');
  if (!app.firstChild || !$('#main')) app.innerHTML = shell();
  else {
    app.querySelectorAll('[data-route]').forEach(function (a) { if (a.dataset.route === ui.route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });

  var v = { resumen: viewResumen, movimientos: viewMovs, presupuesto: viewPresupuesto, metas: viewMetas, deudas: viewDeudas, ajustes: viewAjustes }[ui.route]();
  $('#main').innerHTML = v;
}

function submitMovement(form) {
  var fd = new FormData(form), type = fd.get('type'), cat = fd.get('category'), amount = C.parseCLP(String(fd.get('amount') || ''));
  var errs = {}, newCat = null;
  if (cat === '__new__') {
    var nm = String(form.querySelector('#f-newcat').value).trim();
    if (nm.length < 2 || nm.length > 30) errs.newcat = 'Usa entre 2 y 30 caracteres.';
    else if (cats(type).some(function (c) { return c.name.toLowerCase() === nm.toLowerCase(); })) errs.newcat = 'Esa categoría ya existe.';
    else newCat = { name: nm, type: type, custom: true, bucket: type === 'expense' ? form.querySelector('#f-bucket').value : undefined };
    cat = nm;
  }
  var tags = String(fd.get('tags') || '').split(',').map(function (x) { return x.trim().replace(/^#/, ''); }).filter(Boolean);
  var m = { id: form.dataset.id || uid(), type: type, amount: amount, category: cat, date: fd.get('date'), desc: String(fd.get('desc') || '').trim(), account: String(fd.get('account') || '').trim(), tags: tags, recurring: !!fd.get('recurring') };
  var v = C.validateMovement(m); Object.keys(v).forEach(function (k) { errs[k] = v[k]; });
  if (Object.keys(errs).length) { showErrors(form, errs); return; }
  var dup = C.findDuplicate(movs(), m, form.dataset.id || null);
  var key = C.fingerprint(m);
  if (dup && ui.dup !== key) { ui.dup = key; form.querySelector('#f-dup-err').textContent = 'Ya existe un movimiento igual (misma fecha, monto, descripción y cuenta). Si es otro movimiento, vuelve a pulsar Guardar.'; form.querySelector('#f-save').textContent = 'Guardar de todos modos'; return; }
  if (newCat) S.categories.push(newCat);
  var old = S.movements.find(function (x) { return x.id === m.id; });
  if (old) { m.demo = old.demo; S.movements[S.movements.indexOf(old)] = m; } else S.movements.push(m);
  save(); closeDlg(); toast(old ? 'Movimiento actualizado' : (type === 'income' ? 'Ingreso registrado' : 'Gasto registrado')); render();
}

function submitGoal(form) {
  var v = function (k) { return form.querySelector('#f-' + k) ? form.querySelector('#f-' + k).value : ''; };
  var periodic = numOrNull(v('periodic')), saved = numOrNull(v('saved'));
  var g = { name: v('name').trim(), target: C.parseCLP(v('target')), deadline: v('deadline'), periodic: periodic == null ? 0 : periodic };
  var errs = C.validateGoal(g, { allowPast: !!form.dataset.id });
  if (saved != null && (isNaN(saved) || !Number.isInteger(saved) || saved < 0)) errs.saved = 'Ingresa un monto entero o déjalo vacío.';
  if (Object.keys(errs).length) { showErrors(form, errs); return; }
  if (form.dataset.id) { var o = S.goals.find(function (x) { return x.id === form.dataset.id; }); Object.assign(o, g); }
  else { g.id = uid(); g.history = saved > 0 ? [{ id: uid(), date: today(), amount: saved, note: 'Saldo inicial' }] : []; S.goals.push(g); }
  save(); closeDlg(); toast('Meta guardada'); render();
}

  var g = S.goals.find(function (x) { return x.id === form.dataset.id; }), kind = form.dataset.kind, amt = C.parseCLP(form.querySelector('#f-amount').value), date = form.querySelector('#f-date').value, errs = {};

}

  }
  if (t.dataset.pct) { var n2 = Number(t.value); S.settings.pcts[t.dataset.pct] = Number.isFinite(n2) ? Math.round(n2) : 0; save(); render(); return; }
  if (t.dataset.base !== undefined) { var b = C.parseCLP(t.value); ui.base = isNaN(b) || b < 0 ? 0 : Math.round(b); render(); return; }
  if (t.dataset.cmp !== undefined) { ui.cmp = t.value; render(); return; }
  if (t.dataset.extra !== undefined) { var x = C.parseCLP(t.value || '0'); ui.extra = isNaN(x) || x < 0 ? 0 : Math.round(x); render(); return; }
  if (t.dataset.strat !== undefined) { ui.strategy = t.value; render(); return; }
  if (t.dataset.bucket) { var c = S.categories.find(function (c) { return c.type === 'expense' && c.name === t.dataset.bucket; }); if (c) { c.bucket = t.value; save(); toast('Bloque actualizado'); } return; }
  if (t.dataset.setting) { var s = C.parseCLP(t.value || '0'); if (isNaN(s) || !Number.isInteger(s) || s < 0 && t.dataset.setting !== 'openingBalance') { toast('Ingresa un monto entero válido'); render(); return; } S.settings[t.dataset.setting] = s; save(); toast('Guardado'); render(); return; }
  if (t.dataset.settingCheck) { S.settings[t.dataset.settingCheck] = t.checked; save(); return; }
});
document.addEventListener('input', function (e) { if (e.target.dataset && e.target.dataset.filter === 'q') { ui.f.q = e.target.value; ui.f.limit = 50; $('#movlist').innerHTML = movListHTML(); } if (e.target.name === 'strat' && e.target.closest('[data-ob]')) { var c = $('#ob-custom'); if (c) c.hidden = e.target.value !== 'custom'; } });

/* ---------- Arranque ---------- */
if (S.settings.theme) document.documentElement.setAttribute('data-theme', S.settings.theme);
render();
if (!S.settings.onboarded && !S.movements.length && !S.goals.length && !S.debts.length) openOnboarding(0);
window.addEventListener('hashchange', function () { var h = (location.hash || '').replace('#', ''); if (ROUTES[h] && h !== ui.route) setRoute(h); });
})();
</script>


<!-- Financia feedback widget: requires the Worker route POST /api/feedback -->
<style>
#fin-feedback-launch{position:fixed;right:18px;bottom:18px;z-index:9998;border:0;border-radius:999px;padding:13px 18px;background:#123B35;color:#fff;font:600 14px system-ui;box-shadow:0 8px 24px #123b3533;cursor:pointer}
#fin-feedback-panel{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;background:#071a18aa;font:14px system-ui}
#fin-feedback-panel[aria-hidden="false"]{display:flex}
#fin-feedback-card{background:#fff;color:#18312d;border-radius:18px;padding:22px;width:min(100%,460px);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0004}
#fin-feedback-card h2{margin:0 0 8px;font-size:22px}
#fin-feedback-card p{color:#52645f;line-height:1.45}
#fin-feedback-card label{display:block;font-weight:600;margin:14px 0 6px}
#fin-feedback-card select,#fin-feedback-card textarea,#fin-feedback-card input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd8d3;border-radius:9px;font:inherit;background:white;color:#18312d}
#fin-feedback-card textarea{min-height:85px;resize:vertical}
#fin-feedback-actions{display:flex;gap:8px;margin-top:16px}
#fin-feedback-actions button{flex:1;border:0;border-radius:9px;padding:12px;font:600 14px system-ui;cursor:pointer}
#fin-feedback-send{background:#123B35;color:white}#fin-feedback-close{background:#edf3f0;color:#18312d}
#fin-feedback-status{min-height:20px;font-weight:600;margin-top:12px}
#fin-feedback-honey{position:absolute;left:-9999px}
</style>
<button id="fin-feedback-launch" type="button" aria-haspopup="dialog">Enviar comentarios</button>
<div id="fin-feedback-panel" aria-hidden="true">
  <section id="fin-feedback-card" role="dialog" aria-modal="true" aria-labelledby="fin-feedback-title">
    <h2 id="fin-feedback-title">Ayúdanos a mejorar Financia</h2>
    <p>Tu opinión nos ayuda a mejorar la experiencia. No incluyas contraseñas ni información bancaria.</p>
    <form id="fin-feedback-form">
      <label for="fin-feedback-rating">¿Cómo evaluarías tu experiencia?</label>
      <select id="fin-feedback-rating" name="rating" required>
        <option value="">Selecciona una opción</option><option value="5">5 — Excelente</option><option value="4">4 — Muy buena</option><option value="3">3 — Buena</option><option value="2">2 — Regular</option><option value="1">1 — Mala</option>
      </select>
      <label for="fin-feedback-ease">¿Fue fácil utilizar Financia?</label>
      <select id="fin-feedback-ease" name="ease" required><option value="easy">Sí, bastante</option><option value="medium">Más o menos</option><option value="hard">Me costó</option></select>
      <label for="fin-feedback-features">¿Qué función te gustaría mejorar o agregar?</label>
      <input id="fin-feedback-features" name="feature" maxlength="120" placeholder="Ej.: metas de ahorro">
      <label for="fin-feedback-message">Comentarios o sugerencias</label>
      <textarea id="fin-feedback-message" name="message" maxlength="2000" required placeholder="Cuéntanos qué te pareció..."></textarea>
      <label for="fin-feedback-email">Correo (opcional)</label>
      <input id="fin-feedback-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="correo@ejemplo.com">
      <input id="fin-feedback-honey" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div id="fin-feedback-actions"><button id="fin-feedback-close" type="button">Cancelar</button><button id="fin-feedback-send" type="submit">Enviar</button></div>
      <div id="fin-feedback-status" role="status" aria-live="polite"></div>
    </form>
  </section>
</div>
<script>
(function(){
  var launch=document.getElementById('fin-feedback-launch'), panel=document.getElementById('fin-feedback-panel'), form=document.getElementById('fin-feedback-form'), close=document.getElementById('fin-feedback-close'), send=document.getElementById('fin-feedback-send'), status=document.getElementById('fin-feedback-status');
  function show(open){panel.setAttribute('aria-hidden',open?'false':'true');if(open)document.getElementById('fin-feedback-rating').focus();else launch.focus();}
  launch.addEventListener('click',function(){show(true);});close.addEventListener('click',function(){show(false);});
  panel.addEventListener('click',function(e){if(e.target===panel)show(false);});
  form.addEventListener('submit',async function(e){
    e.preventDefault(); status.textContent='Enviando…';send.disabled=true;
    var d=new FormData(form), payload={rating:Number(d.get('rating')),ease:String(d.get('ease')||''),feature:String(d.get('feature')||''),message:String(d.get('message')||''),email:String(d.get('email')||''),website:String(d.get('website')||'')};
    try{
      var res=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),credentials:'same-origin'});
      var result=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(result.error||'No se pudo guardar el comentario. Inténtalo más tarde.');
      form.reset();status.textContent='¡Gracias! Tu comentario quedó guardado.';status.style.color='#176b45';
      setTimeout(function(){show(false);status.textContent='';},1800);
    }catch(err){status.textContent=err.message||'No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo.';status.style.color='#a52d2d';}
    finally{send.disabled=false;}
  });
})();
</script>
